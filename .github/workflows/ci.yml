name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: globetrotter
          POSTGRES_PASSWORD: globetrotter
          POSTGRES_DB: globetrotter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globetrotter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://globetrotter:globetrotter@localhost:5432/globetrotter_test?schema=public
      TEST_DATABASE_URL: postgresql://globetrotter:globetrotter@localhost:5432/globetrotter_test?schema=public
      JWT_SECRET: ci-secret-value-not-used-in-production
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w server

      - name: Apply migrations
        run: npm run db:deploy -w server

      - name: Fail if schema.prisma has drifted from the migrations
        working-directory: server
        run: >-
          npx prisma migrate diff
          --from-schema-datasource ./prisma/schema.prisma
          --to-schema-datamodel ./prisma/schema.prisma
          --exit-code

      - name: Typecheck
        run: npm run typecheck -w server

      - name: Build
        run: npm run build -w server

      - name: Test
        run: npm test -w server

      - name: Verify the seed runs
        run: npm run db:seed -w server

  client:
    name: Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The workspaces share one node_modules, so server/ postinstall work
      # has to happen before the client typecheck resolves cleanly.
      - name: Generate Prisma client
        run: npm run db:generate -w server

      - name: Typecheck
        run: npm run typecheck -w client

      - name: Build
        run: npm run build -w client

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  image:
    name: Server image
    runs-on: ubuntu-latest
    needs: [server]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: globetrotter-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm \
            -e DATABASE_URL='postgresql://u:p@127.0.0.1:5432/db' \
            -e JWT_SECRET='ci-secret-value-not-used-in-production' \
            globetrotter-server:${{ github.sha }} \
            node --input-type=module -e "await import('./dist/app.js'); console.log('image boots')"
