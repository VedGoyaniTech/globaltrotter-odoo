services:
  db:
    image: postgres:16-alpine
    container_name: globetrotter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: globetrotter
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: globetrotter-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://globetrotter:globetrotter@db:5432/globetrotter?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-production}
      JWT_EXPIRES_IN: 7d
      TRUST_PROXY: 0
      UPLOAD_DIR: /app/uploads
      # Populates cities, activities and the demo accounts on first run so a
      # fresh clone is not an empty app. The seed is idempotent.
      SEED_ON_BOOT: "true"
      APP_URL: http://localhost:5173
      # No mail provider in the demo stack - the reset link is printed to
      # `docker compose logs backend`. Set to smtp with SMTP_URL to really send.
      MAIL_TRANSPORT: log
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: globetrotter-frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/repo/client
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  uploads_data:
